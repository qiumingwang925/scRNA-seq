# One-command build + run for the scNexus demo.
# Landing page: http://localhost:3838   (Modules I-IV: 3839-3842)
services:
  scnexus:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Stamps the image with the commit it was built from. Set it with
        #   SOURCE_COMMIT=$(git rev-parse HEAD) docker compose build
        # Defaults to "unknown" so a plain `docker compose build` still works.
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    image: scnexus-demo:latest
    container_name: scnexus-demo
    ports:
      - "3838-3842:3838-3842"
    volumes:
      # Drop your own sample folders in ./datasets on the host to load them in
      # Module I. The bind mount is the only host folder the apps can see.
      - ./datasets:/srv/app/datasets
    environment:
      # Restricts Module I's file browser to the datasets mount + the bundled
      # sample data, instead of exposing the whole container filesystem.
      - SCNEXUS_DATA_ROOT=/srv/app/datasets
    # Single-cell objects + CellChat/LIANA are memory-hungry. Raise this (and
    # Docker Desktop's memory limit) if an app dies mid-computation.
    mem_limit: 16g
    restart: unless-stopped
